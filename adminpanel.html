<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — ProLoveHub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f0f2; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 16px 24px; border-radius: 12px; }
        .btn { padding: 10px 20px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #C2185B; color: white; }
        .btn-secondary { background: #ddd; color: #333; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-content { background: white; padding: 32px; border-radius: 16px; max-width: 500px; width: 100%; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .form-row { display: flex; gap: 12px; }
        .form-row > * { flex: 1; }
        table { width: 100%; background: white; border-radius: 12px; overflow: hidden; }
        th { background: #f9f9f9; padding: 12px; text-align: left; }
        td { padding: 12px; border-top: 1px solid #eee; }
        .actions { display: flex; gap: 4px; }
        .actions button { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-edit { background: #f0e6f0; color: #C2185B; }
        .btn-remove { background: #f8d7da; color: #721c24; }
        .btn-approve { background: #d4edda; color: #155724; }
        .btn-reject { background: #f8d7da; color: #721c24; }
        .status-badge { padding: 2px 12px; border-radius: 50px; font-size: 12px; font-weight: 600; }
        .status-active { background: #d4edda; color: #155724; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Admin Panel</h1>
            <button class="btn btn-primary" onclick="logout()">Logout</button>
        </div>

        <div style="margin: 20px 0; display: flex; gap: 12px; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="openAddModal()">➕ Add Member</button>
            <button class="btn btn-secondary" onclick="loadMembers()">🔄 Refresh</button>
        </div>

        <div id="stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;"></div>

        <div style="background:white;border-radius:12px;overflow:auto;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Gender</th>
                        <th>Looking For</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="membersBody">
                    <tr><td colspan="7" style="text-align:center;padding:40px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="memberModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Member</h2>
            <form id="memberForm">
                <input type="hidden" id="editId" />
                <div class="form-group"><label>Full Name *</label><input type="text" id="formName" required /></div>
                <div class="form-group"><label>Email *</label><input type="email" id="formEmail" required /></div>
                <div class="form-row">
                    <div class="form-group"><label>Gender *</label><select id="formGender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
                    <div class="form-group"><label>Looking For *</label><select id="formLookingFor" required><option value="">Select</option><option>Men</option><option>Women</option><option>Everyone</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Date of Birth</label><input type="date" id="formDob" /></div>
                    <div class="form-group"><label>Location</label><input type="text" id="formLocation" placeholder="City" /></div>
                </div>
                <div class="form-group"><label>Bio</label><textarea id="formBio" rows="2"></textarea></div>
                <div class="form-group"><label>Interests</label><input type="text" id="formInterests" placeholder="Travel, Music" /></div>
                <div class="form-group"><label>Status</label><select id="formStatus"><option value="active">Active</option><option value="pending" selected>Pending</option><option value="rejected">Rejected</option></select></div>
                <div style="display:flex;gap:10px;margin-top:20px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex:1;">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // Supabase Config
        const SUPABASE_URL = 'https://precvldulohwudpfmzsn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZWN2bGR1bG9od3VkcGZtenNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDMwNzUsImV4cCI6MjEwMjU3OTA3NX0.BYpgOVlLG1cw5pdYfjrhI_bP615ALKCr1tb9U5Ooc0c';
        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let members = [];
        let currentEditId = null;

        // Check admin
        async function checkAdmin() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { window.location.href = 'adminlogin.html'; return false; }
            const { data: member } = await supabase.from('members').select('source').eq('id', user.id).single();
            if (!member || member.source !== 'admin') {
                alert('Access denied.');
                window.location.href = 'loginpage.html';
                return false;
            }
            return true;
        }

        // Load members
        async function loadMembers() {
            const { data, error } = await supabase.from('members').select('*').order('created_at', { ascending: false });
            if (error) { showToast('Error: ' + error.message, 'error'); return; }
            members = data || [];
            render();
        }

        // Render
        function render() {
            const tbody = document.getElementById('membersBody');

            // Stats
            const total = members.length;
            const active = members.filter(m => m.status === 'active').length;
            const pending = members.filter(m => m.status === 'pending').length;
            const rejected = members.filter(m => m.status === 'rejected').length;
            document.getElementById('stats').innerHTML = `
                <div style="background:#fff;padding:16px;border-radius:12px;text-align:center;"><strong>${total}</strong><br>Total</div>
                <div style="background:#fff;padding:16px;border-radius:12px;text-align:center;"><strong>${active}</strong><br>Active</div>
                <div style="background:#fff;padding:16px;border-radius:12px;text-align:center;"><strong>${pending}</strong><br>Pending</div>
                <div style="background:#fff;padding:16px;border-radius:12px;text-align:center;"><strong>${rejected}</strong><br>Rejected</div>
            `;

            if (members.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;">No members found</td></tr>';
                return;
            }

            let html = '';
            members.forEach((m, i) => {
                const statusClass = m.status === 'active' ? 'status-active' : m.status === 'pending' ? 'status-pending' :
                    'status-rejected';
                html += `<tr>
                    <td>${i+1}</td>
                    <td><strong>${m.name}</strong></td>
                    <td>${m.email}</td>
                    <td>${m.gender || '—'}</td>
                    <td>${m.looking_for || '—'}</td>
                    <td><span class="status-badge ${statusClass}">${m.status || 'pending'}</span></td>
                    <td class="actions">
                        ${m.status === 'pending' || m.status === 'rejected' ? `<button class="btn-approve" onclick="approveMember('${m.id}')">Approve</button>` : ''}
                        <button class="btn-edit" onclick="openEditModal('${m.id}')">Edit</button>
                        ${m.status !== 'rejected' ? `<button class="btn-reject" onclick="rejectMember('${m.id}')">Reject</button>` : ''}
                        <button class="btn-remove" onclick="removeMember('${m.id}')">Remove</button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // CRUD
        async function approveMember(id) {
            if (!confirm('Approve this member?')) return;
            const { error } = await supabase.from('members').update({ status: 'active' }).eq('id', id);
            if (error) showToast('Error: ' + error.message, 'error');
            else { showToast('Approved!', 'success');
                loadMembers(); }
        }

        async function rejectMember(id) {
            if (!confirm('Reject this member?')) return;
            const { error } = await supabase.from('members').update({ status: 'rejected' }).eq('id', id);
            if (error) showToast('Error: ' + error.message, 'error');
            else { showToast('Rejected.', 'warning');
                loadMembers(); }
        }

        async function removeMember(id) {
            if (!confirm('Remove permanently?')) return;
            const { error } = await supabase.from('members').delete().eq('id', id);
            if (error) showToast('Error: ' + error.message, 'error');
            else { showToast('Removed.', 'error');
                loadMembers(); }
        }

        // Modal functions
        function openAddModal() {
            currentEditId = null;
            document.getElementById('editId').value = '';
            document.getElementById('formName').value = '';
            document.getElementById('formEmail').value = '';
            document.getElementById('formGender').value = '';
            document.getElementById('formLookingFor').value = '';
            document.getElementById('formDob').value = '';
            document.getElementById('formLocation').value = '';
            document.getElementById('formBio').value = '';
            document.getElementById('formInterests').value = '';
            document.getElementById('formStatus').value = 'pending';
            document.getElementById('modalTitle').textContent = 'Add Member';
            document.getElementById('memberModal').classList.add('open');
        }

        function openEditModal(id) {
            const member = members.find(m => m.id === id);
            if (!member) return;
            currentEditId = id;
            document.getElementById('editId').value = id;
            document.getElementById('formName').value = member.name;
            document.getElementById('formEmail').value = member.email;
            document.getElementById('formGender').value = member.gender || '';
            document.getElementById('formLookingFor').value = member.looking_for || '';
            document.getElementById('formDob').value = member.dob || '';
            document.getElementById('formLocation').value = member.location || '';
            document.getElementById('formBio').value = member.bio || '';
            document.getElementById('formInterests').value = (member.interests || []).join(', ');
            document.getElementById('formStatus').value = member.status || 'pending';
            document.getElementById('modalTitle').textContent = 'Edit Member';
            document.getElementById('memberModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('memberModal').classList.remove('open');
        }

        // Form submit
        document.getElementById('memberForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('formName').value.trim(),
                email: document.getElementById('formEmail').value.trim(),
                gender: document.getElementById('formGender').value,
                looking_for: document.getElementById('formLookingFor').value,
                dob: document.getElementById('formDob').value || null,
                location: document.getElementById('formLocation').value.trim() || null,
                bio: document.getElementById('formBio').value.trim() || null,
                interests: document.getElementById('formInterests').value.trim() ? document.getElementById('formInterests')
                    .value.trim().split(',').map(s => s.trim()).filter(Boolean) : [],
                status: document.getElementById('formStatus').value
            };

            if (!data.name || !data.email || !data.gender || !data.looking_for) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            let result;
            if (id) {
                result = await supabase.from('members').update(data).eq('id', id);
                if (result.error) showToast('Error: ' + result.error.message, 'error');
                else { showToast('Updated!', 'success');
                    closeModal();
                    loadMembers(); }
            } else {
                result = await supabase.from('members').insert([{ ...data, source: 'admin' }]);
                if (result.error) showToast('Error: ' + result.error.message, 'error');
                else { showToast('Added!', 'success');
                    closeModal();
                    loadMembers(); }
            }
        });

        // Toast
        function showToast(msg, type) {
            const container = document.getElementById('toastContainer');
            const div = document.createElement('div');
            div.className = 'toast';
            div.textContent = msg;
            container.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // Logout
        async function logout() {
            if (confirm('Logout?')) {
                await supabase.auth.signOut();
                localStorage.removeItem('isAdminLoggedIn');
                window.location.href = 'index.html';
            }
        }

        // Init
        (async function init() {
            const ok = await checkAdmin();
            if (ok) await loadMembers();
        })();
    </script>
</body>
</html>
