<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discover Matches — ProLoveHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #C2185B;
            --primary-light: #F8E8EE;
            --primary-gradient: linear-gradient(135deg, #C2185B, #E85D8A);
            --secondary: #D4A54A;
            --secondary-gradient: linear-gradient(135deg, #D4A54A, #E8C86A);
            --dark: #1A1423;
            --text: #2D2A2E;
            --text-light: #6B6570;
            --text-lighter: #9A94A3;
            --white: #FFFFFF;
            --off-white: #FAF9FB;
            --shadow-sm: 0 4px 20px rgba(26,20,35,0.06);
            --shadow-md: 0 12px 40px rgba(26,20,35,0.08);
            --shadow-lg: 0 24px 60px rgba(194,24,91,0.12);
            --shadow-xl: 0 32px 80px rgba(194,24,91,0.18);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body { font-family:'Inter',sans-serif; color:var(--text); background:var(--off-white); overflow-x:hidden; -webkit-font-smoothing:antialiased; }
        .container { max-width:1280px; margin:0 auto; padding:0 24px; }
        ::selection { background:var(--primary); color:var(--white); }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:var(--off-white); }
        ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--primary-dark); }

        .btn-primary {
            display:inline-flex; align-items:center; gap:10px; padding:14px 32px;
            background:var(--primary-gradient); color:var(--white); border:none;
            border-radius:50px; font-size:15px; font-weight:600; font-family:'Inter',sans-serif;
            cursor:pointer; transition:var(--transition); text-decoration:none;
            box-shadow:0 8px 30px rgba(194,24,91,0.25); position:relative; overflow:hidden;
        }
        .btn-primary::after {
            content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition:0.6s;
        }
        .btn-primary:hover::after { left:100%; }
        .btn-primary:hover { transform:translateY(-3px); box-shadow:0 12px 40px rgba(194,24,91,0.35); }

        .btn-view {
            padding:8px 18px; border-radius:50px; border:2px solid var(--primary);
            background:transparent; color:var(--primary); font-weight:600; font-size:13px;
            cursor:pointer; transition:var(--transition); font-family:'Inter',sans-serif;
            display:inline-flex; align-items:center; gap:6px;
        }
        .btn-view:hover { background:var(--primary); color:var(--white); transform:translateY(-2px); box-shadow:0 4px 16px rgba(194,24,91,0.2); }

        .btn-message {
            padding:8px 18px; border-radius:50px; border:none;
            background:var(--primary-gradient); color:var(--white); font-weight:600; font-size:13px;
            cursor:pointer; transition:var(--transition); font-family:'Inter',sans-serif;
            display:inline-flex; align-items:center; gap:6px; box-shadow:0 4px 16px rgba(194,24,91,0.25);
        }
        .btn-message:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(194,24,91,0.35); }

        .btn-like-sm {
            width:40px; height:40px; border-radius:50%; border:none;
            display:flex; align-items:center; justify-content:center; font-size:16px;
            cursor:pointer; transition:var(--transition); background:var(--off-white); color:var(--text-lighter);
        }
        .btn-like-sm:hover { background:var(--primary-gradient); color:var(--white); transform:scale(1.1); }
        .btn-like-sm.liked { background:var(--primary-gradient); color:var(--white); }

        .header {
            position:fixed; top:0; left:0; width:100%; z-index:1000; padding:14px 0;
            background:rgba(255,255,255,0.97); backdrop-filter:blur(20px);
            box-shadow:0 2px 40px rgba(0,0,0,0.06);
        }
        .header .container { display:flex; align-items:center; justify-content:space-between; }
        .logo { display:flex; align-items:center; gap:14px; text-decoration:none; }
        .logo .logo-icon-wrapper { position:relative; width:44px; height:44px; flex-shrink:0; }
        .logo .logo-icon-wrapper .logo-bg {
            position:absolute; width:100%; height:100%; background:var(--primary-gradient);
            border-radius:14px; transform:rotate(-4deg); box-shadow:0 6px 24px rgba(194,24,91,0.2);
            transition:var(--transition);
        }
        .logo:hover .logo-icon-wrapper .logo-bg { transform:rotate(0deg) scale(1.05); }
        .logo .logo-icon-wrapper .logo-heart {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            font-size:20px; color:var(--white); z-index:2; text-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
        .logo .logo-text { display:flex; flex-direction:column; line-height:1; }
        .logo .logo-text .brand {
            font-size:22px; font-weight:900; letter-spacing:-0.5px; font-family:'Playfair Display',serif;
        }
        .logo .logo-text .brand .pro { color:var(--primary); }
        .logo .logo-text .brand .love { color:var(--dark); }
        .logo .logo-text .brand .hub { color:var(--secondary); }
        .logo .logo-text .tagline { font-size:9px; font-weight:600; color:var(--text-light); letter-spacing:2.5px; text-transform:uppercase; margin-top:2px; }
        .logo .logo-text .tagline span { color:var(--secondary); }

        .nav-links { display:flex; align-items:center; gap:32px; list-style:none; }
        .nav-links a { font-weight:500; color:var(--text); transition:var(--transition); font-size:14px; text-decoration:none; position:relative; }
        .nav-links a::after { content:''; position:absolute; bottom:-4px; left:0; width:0; height:2px; background:var(--primary-gradient); transition:var(--transition); }
        .nav-links a:hover::after { width:100%; }
        .nav-links a:hover { color:var(--primary); }
        .nav-links a.active { color:var(--primary); font-weight:600; }
        .nav-links a.active::after { width:100%; }

        .hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none; padding:4px; }
        .hamburger span { width:28px; height:2.5px; background:var(--dark); border-radius:4px; transition:var(--transition); }

        .page-header { padding:100px 0 40px; background:var(--white); border-bottom:1px solid rgba(0,0,0,0.04); }
        .page-header .container { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
        .page-header h1 { font-size:32px; font-weight:800; font-family:'Playfair Display',serif; color:var(--dark); }
        .page-header h1 .highlight { color:var(--primary); }
        .page-header p { color:var(--text-light); font-size:16px; }
        .page-header .header-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .page-header .header-actions .match-count {
            background:var(--primary-light); color:var(--primary); padding:8px 20px;
            border-radius:50px; font-size:14px; font-weight:600;
        }
        .page-header .header-actions .match-count i { margin-right:6px; }

        .filter-container {
            display:flex; gap:12px; align-items:center; flex-wrap:wrap;
        }
        .filter-container select {
            padding:8px 16px; border-radius:50px; border:1px solid rgba(0,0,0,0.06);
            background:var(--white); font-family:'Inter',sans-serif; font-size:13px;
            font-weight:500; color:var(--text); outline:none; cursor:pointer;
            transition:var(--transition);
        }
        .filter-container select:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(194,24,91,0.06); }

        .discover-section { padding:40px 0 80px; }
        .matches-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px; }
        .match-card {
            background:var(--white); border-radius:var(--radius); overflow:hidden;
            box-shadow:var(--shadow-sm); transition:var(--transition);
            border:1px solid rgba(0,0,0,0.04); position:relative;
        }
        .match-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-lg); border-color:var(--primary-light); }
        .match-card .card-image {
            position:relative; height:240px; background:linear-gradient(135deg,var(--primary-light),var(--secondary-light));
            display:flex; align-items:center; justify-content:center; overflow:hidden;
        }
        .match-card .card-image .member-photo {
            width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0;
        }
        .match-card .card-image .avatar-big {
            width:90px; height:90px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:32px; font-weight:700; color:var(--white); border:4px solid var(--white);
            box-shadow:0 4px 20px rgba(0,0,0,0.1); z-index:2; position:relative;
        }
        .match-card .card-image .photo-overlay {
            position:absolute; bottom:0; left:0; right:0; padding:8px 14px;
            background:linear-gradient(transparent, rgba(0,0,0,0.3));
            display:flex; justify-content:flex-end; z-index:3;
        }
        .match-card .card-image .photo-overlay .upload-btn {
            background:rgba(255,255,255,0.9); border:none; border-radius:50px;
            padding:4px 14px; font-size:11px; font-weight:600; color:var(--primary);
            cursor:pointer; transition:var(--transition);
            display:flex; align-items:center; gap:4px;
        }
        .match-card .card-image .photo-overlay .upload-btn:hover {
            background:var(--white); transform:scale(1.05);
        }
        .match-card .card-image .badge-match {
            position:absolute; top:14px; right:14px; z-index:5;
            background:var(--secondary-gradient); color:var(--white); padding:4px 14px;
            border-radius:50px; font-size:12px; font-weight:700; box-shadow:0 4px 16px rgba(212,165,74,0.3);
        }
        .match-card .card-image .badge-verified {
            position:absolute; bottom:14px; left:14px; z-index:5;
            background:rgba(255,255,255,0.92); backdrop-filter:blur(10px); padding:4px 12px;
            border-radius:50px; font-size:11px; font-weight:600; color:#4CAF50;
            display:flex; align-items:center; gap:4px; box-shadow:var(--shadow-sm);
        }
        .match-card .card-image .badge-verified i { font-size:12px; }
        .match-card .card-image .badge-online {
            position:absolute; bottom:14px; right:14px; z-index:5;
            width:14px; height:14px; border-radius:50%; background:#4CAF50;
            border:2px solid var(--white); box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
        .match-card .card-body { padding:20px 20px 16px; }
        .match-card .card-body .name-age { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
        .match-card .card-body .name-age h4 { font-size:20px; font-weight:700; color:var(--dark); }
        .match-card .card-body .name-age .age { font-size:16px; color:var(--text-light); font-weight:500; }
        .match-card .card-body .location { font-size:13px; color:var(--text-lighter); display:flex; align-items:center; gap:4px; margin-bottom:6px; }
        .match-card .card-body .location i { font-size:12px; }
        .match-card .card-body .bio {
            font-size:14px; color:var(--text-light); line-height:1.6;
            margin-bottom:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
        }
        .match-card .card-body .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
        .match-card .card-body .tags span { background:var(--off-white); padding:3px 12px; border-radius:50px; font-size:11px; font-weight:500; color:var(--text-light); }
        .match-card .card-body .tags span i { margin-right:4px; font-size:10px; color:var(--primary); }
        .match-card .card-body .looking-for {
            font-size:12px; color:var(--text-lighter); background:var(--primary-light);
            padding:4px 12px; border-radius:50px; display:inline-block; margin-bottom:12px;
        }
        .match-card .card-body .looking-for i { margin-right:4px; color:var(--primary); }
        .match-card .card-body .actions-row {
            display:flex; align-items:center; justify-content:space-between;
            padding-top:12px; border-top:1px solid rgba(0,0,0,0.04); gap:8px; flex-wrap:wrap;
        }
        .match-card .card-body .actions-row .action-buttons { display:flex; gap:8px; }
        .match-card .card-body .actions-row .primary-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .match-card .card-body .actions-row .primary-actions .btn-view,
        .match-card .card-body .actions-row .primary-actions .btn-message { font-size:12px; padding:6px 14px; }

        .empty-state {
            text-align:center; padding:60px 20px; background:var(--white);
            border-radius:var(--radius); border:2px dashed rgba(0,0,0,0.06);
            grid-column:1/-1;
        }
        .empty-state i { font-size:56px; color:var(--primary-light); margin-bottom:16px; }
        .empty-state h3 { font-size:22px; font-weight:700; margin-bottom:8px; }
        .empty-state p { color:var(--text-light); max-width:400px; margin:0 auto 20px; }

        @media (max-width:1024px) { .matches-grid { grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); } }
        @media (max-width:768px) {
            .nav-links { display:none; flex-direction:column; position:absolute; top:100%; left:0; width:100%; background:var(--white); padding:24px; box-shadow:0 20px 40px rgba(0,0,0,0.1); gap:14px; border-radius:0 0 var(--radius) var(--radius); }
            .nav-links.open { display:flex; }
            .hamburger { display:flex; }
            .page-header { padding:80px 0 28px; }
            .page-header h1 { font-size:26px; }
            .page-header .container { flex-direction:column; align-items:flex-start; gap:12px; }
            .filter-container { width:100%; }
            .filter-container select { flex:1; }
            .matches-grid { grid-template-columns:1fr 1fr; gap:16px; }
            .match-card .card-image { height:180px; }
            .match-card .card-image .avatar-big { width:60px; height:60px; font-size:20px; }
            .match-card .card-body { padding:14px 16px 12px; }
            .match-card .card-body .name-age h4 { font-size:16px; }
            .match-card .card-body .bio { font-size:13px; -webkit-line-clamp:1; }
            .match-card .card-body .actions-row .primary-actions .btn-view,
            .match-card .card-body .actions-row .primary-actions .btn-message { font-size:11px; padding:5px 12px; }
            .match-card .card-body .actions-row .primary-actions .btn-message span { display:none; }
        }
        @media (max-width:480px) {
            .matches-grid { grid-template-columns:1fr; max-width:400px; margin:0 auto; }
            .page-header h1 { font-size:22px; }
            .match-card .card-image { height:200px; }
            .logo .logo-text .brand { font-size:18px; }
            .logo .logo-icon-wrapper { width:38px; height:38px; }
            .logo .logo-icon-wrapper .logo-heart { font-size:16px; }
            .match-card .card-body .actions-row { flex-direction:column; align-items:stretch; gap:10px; }
            .match-card .card-body .actions-row .primary-actions { justify-content:center; }
            .match-card .card-body .actions-row .action-buttons { justify-content:center; }
            .filter-container select { font-size:12px; padding:6px 12px; }
        }

        @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .match-card { animation:fadeInUp 0.5s ease forwards; }
        .match-card:nth-child(1) { animation-delay:0.05s; }
        .match-card:nth-child(2) { animation-delay:0.10s; }
        .match-card:nth-child(3) { animation-delay:0.15s; }
        .match-card:nth-child(4) { animation-delay:0.20s; }
        .match-card:nth-child(5) { animation-delay:0.25s; }
        .match-card:nth-child(6) { animation-delay:0.30s; }
        .match-card:nth-child(7) { animation-delay:0.35s; }
        .match-card:nth-child(8) { animation-delay:0.40s; }
        .match-card:nth-child(9) { animation-delay:0.45s; }
        .match-card:nth-child(10) { animation-delay:0.50s; }
        .match-card:nth-child(11) { animation-delay:0.55s; }
        .match-card:nth-child(12) { animation-delay:0.60s; }
    </style>
</head>
<body>

    <header class="header" id="header">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon-wrapper"><div class="logo-bg"></div><i class="fas fa-heart logo-heart"></i></div>
                <div class="logo-text">
                    <span class="brand"><span class="pro">Pro</span><span class="love">Love</span><span class="hub">Hub</span></span>
                    <span class="tagline">Premium <span>Matchmaking</span></span>
                </div>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="members.html" class="active">Discover</a></li>
                <li><a href="signup.html" class="btn-primary" style="padding:8px 20px;font-size:13px;">Sign Up</a></li>
                <li><a href="loginpage.html" style="font-weight:600;">Log In</a></li>
            </ul>
            <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <div>
                <h1>Discover Your <span class="highlight">Perfect Match</span></h1>
                <p>Browse through curated profiles tailored to your preferences.</p>
            </div>
            <div class="header-actions">
                <span class="match-count" id="matchCount"><i class="fas fa-heart"></i> 0 Members</span>
                <div class="filter-container">
                    <select id="genderFilter">
                        <option value="all">All Genders</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <select id="statusFilter">
                        <option value="active">Active Members</option>
                        <option value="pending">Pending Members</option>
                        <option value="all">All Members</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <section class="discover-section">
        <div class="container">
            <div class="matches-grid" id="matchesGrid">
                <!-- Members will be loaded here -->
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Hamburger
            document.getElementById('hamburger').addEventListener('click', function() {
                document.getElementById('navLinks').classList.toggle('open');
            });
            document.querySelectorAll('.nav-links a').forEach(function(link) {
                link.addEventListener('click', function() {
                    document.getElementById('navLinks').classList.remove('open');
                });
            });

            // Supabase
            const SUPABASE_URL = 'https://precvldulohwudpfmzsn.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZWN2bGR1bG9od3VkcGZtenNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDMwNzUsImV4cCI6MjEwMjU3OTA3NX0.BYpgOVlLG1cw5pdYfjrhI_bP615ALKCr1tb9U5Ooc0c';
            const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const grid = document.getElementById('matchesGrid');
            const matchCount = document.getElementById('matchCount');
            const genderFilter = document.getElementById('genderFilter');
            const statusFilter = document.getElementById('statusFilter');

            function escapeHtml(text) {
                if (!text) return '—';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getMatchPercentage() {
                return Math.floor(Math.random() * 38) + 62;
            }

            // Load members
            async function loadMembers() {
                try {
                    let query = supabase
                        .from('members')
                        .select('*')
                        .order('created_at', { ascending: false });

                    var statusValue = statusFilter.value;
                    if (statusValue !== 'all') {
                        query = query.eq('status', statusValue);
                    }

                    var genderValue = genderFilter.value;
                    if (genderValue !== 'all') {
                        query = query.eq('gender', genderValue);
                    }

                    var result = await query;
                    var data = result.data;
                    var error = result.error;

                    if (error) throw error;

                    if (!data || data.length === 0) {
                        grid.innerHTML =
                            '<div class="empty-state"><i class="fas fa-heart"></i><h3>No members found</h3><p>Try adjusting your filters or check back later.</p></div>';
                        matchCount.innerHTML = '<i class="fas fa-heart"></i> 0 Members';
                        return;
                    }

                    matchCount.innerHTML = '<i class="fas fa-heart"></i> ' + data.length + ' Members';

                    var colors = ['#C2185B', '#D4A54A', '#4CAF50', '#7B1FA2', '#00695C', '#E65100', '#1565C0', '#AD1457'];
                    var html = '';

                    data.forEach(function(member, index) {
                        var initials = member.name.split(' ').map(function(n) { return n[0]; }).join('').toUpperCase()
                            .slice(0, 2);
                        var color = colors[index % colors.length];

                        var age = '—';
                        if (member.dob) {
                            var birth = new Date(member.dob);
                            var ageNum = new Date().getFullYear() - birth.getFullYear();
                            var mth = new Date().getMonth() - birth.getMonth();
                            if (mth < 0 || (mth === 0 && new Date().getDate() < birth.getDate())) ageNum--;
                            if (ageNum > 0 && ageNum < 100) age = ageNum;
                        }

                        var interests = Array.isArray(member.interests) ? member.interests : [];
                        var matchPercent = getMatchPercentage();
                        var statusBadge = member.status === 'active' ? '🟢 Active' : '🟡 Pending';
                        var lookingIcon = member.looking_for === 'Men' ? '♂️' : member.looking_for === 'Women' ? '♀️' :
                            '🌍';
                        var photoHtml = '';

                        if (member.photo_url) {
                            photoHtml =
                                '<img src="' + member.photo_url + '" class="member-photo" alt="' + escapeHtml(member
                                .name) + '" />';
                            photoHtml +=
                                '<div class="avatar-big" style="background:' + color + ';border:4px solid rgba(255,255,255,0.9);">' +
                                initials + '</div>';
                        } else {
                            photoHtml = '<div class="avatar-big" style="background:' + color + ';">' + initials +
                                '</div>';
                        }

                        html += '<div class="match-card">';
                        html += '<div class="card-image">';
                        html += photoHtml;
                        html += '<span class="badge-match">' + matchPercent + '% Match</span>';
                        html += '<span class="badge-verified"><i class="fas fa-check-circle"></i> Verified</span>';
                        html += '<span class="badge-online"></span>';
                        html += '</div>';
                        html += '<div class="card-body">';
                        html += '<div class="name-age"><h4>' + escapeHtml(member.name) + '</h4><span class="age">' + age +
                            '</span></div>';
                        html += '<div class="location"><i class="fas fa-map-marker-alt"></i> ' + escapeHtml(member
                            .location || 'Not set') + '</div>';
                        html += '<div class="looking-for"><i class="fas fa-search"></i> Looking for: ' + escapeHtml(
                            member.looking_for || 'Not specified') + ' ' + lookingIcon + ' • <span style="color:' + (member
                            .status === 'active' ? '#4CAF50' : '#E65100') + ';">' + statusBadge + '</span></div>';
                        html += '<div class="bio">' + escapeHtml(member.bio || 'No bio yet.') + '</div>';
                        html += '<div class="tags">';
                        if (interests.length > 0) {
                            for (var i = 0; i < Math.min(interests.length, 3); i++) {
                                html += '<span><i class="fas fa-tag"></i> ' + escapeHtml(interests[i]) + '</span>';
                            }
                            if (interests.length > 3) {
                                html += '<span>+' + (interests.length - 3) + ' more</span>';
                            }
                        } else {
                            html += '<span><i class="fas fa-user"></i> No interests listed</span>';
                        }
                        html += '</div>';
                        html += '<div class="actions-row">';
                        html +=
                            '<div class="action-buttons"><button class="btn-like-sm" onclick="this.classList.toggle(\'liked\')"><i class="fas fa-heart"></i></button></div>';
                        html += '<div class="primary-actions">';
                        html +=
                            '<button class="btn-view" onclick="alert(\'👤 Viewing ' + escapeHtml(member.name) + '\\\'s profile...\\n📧 Email: ' +
                            escapeHtml(member.email) + '\\n📊 Status: ' + (member.status || 'pending') +
                            '\\n💬 Bio: ' + escapeHtml(member.bio || 'No bio') + '\\n📍 Location: ' + escapeHtml(member
                                .location || 'Not set') + '\')"><i class="fas fa-user"></i> View Profile</button>';
                        html +=
                            '<button class="btn-message" onclick="alert(\'💬 Start a conversation with ' + escapeHtml(member
                                .name) + '!\\n📧 Email: ' + escapeHtml(member.email) + '\')"><i class="fas fa-comment"></i> <span>Message</span></button>';
                        html += '</div></div></div></div>';
                    });

                    grid.innerHTML = html;
                } catch (err) {
                    console.error('Error:', err);
                    grid.innerHTML =
                        '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Could not load members</h3><p>' +
                        (err.message || 'Please try again later.') + '</p></div>';
                }
            }

            // Event listeners for filters
            genderFilter.addEventListener('change', loadMembers);
            statusFilter.addEventListener('change', loadMembers);

            // Load members on page load
            loadMembers();
        });
    </script>

</body>
</html>
